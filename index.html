<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Price A/B test arm (see src/pricing.js and functions/_middleware.js).
         The server sets the one-year cookie on every page response; this runs
         before first paint to show that arm's prices, falls back to the arm
         remembered in localStorage if cookies were cleared, and assigns one
         itself only if the server did not (local dev). Crawlers always get B. */
      (function () {
        try {
          var d = document.documentElement
          if (/bot|crawl|spider|slurp|lighthouse|headless|mediapartners|facebookexternalhit|preview/i.test(navigator.userAgent)) {
            d.setAttribute('data-price', 'ab-b')
            return
          }
          var c = document.cookie
          var m = c.match(/(?:^|; )sponge_ab_price=([AB])/)
          var v = m ? m[1] : null
          var ls = null
          try { ls = localStorage.getItem('sponge-ab-price') } catch (e) {}
          if (ls !== 'A' && ls !== 'B') ls = null
          // The server just assigned a new arm (marker cookie), but this browser
          // still remembers its original one (cookies cleared): keep the original.
          if (/(?:^|; )sponge_ab_new=1/.test(c)) {
            if (ls) v = ls
            document.cookie = 'sponge_ab_new=; Max-Age=0; Path=/'
          }
          if (!v) v = ls
          if (v !== 'A' && v !== 'B') v = Math.random() < 0.5 ? 'A' : 'B'
          // Only write the cookie when it has to change: in Safari a script write
          // replaces the server's one-year cookie with a 7-day one. The server
          // re-issues it on the next page load either way.
          if (!m || m[1] !== v) {
            document.cookie = 'sponge_ab_price=' + v + '; Max-Age=31536000; Path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '')
          }
          try { localStorage.setItem('sponge-ab-price', v) } catch (e) {}
          d.setAttribute('data-price', 'ab-' + v.toLowerCase())
        } catch (e) {}
      })()
    </script>
    <meta name="theme-color" content="#0b6bcb" />

    <!-- Site-wide defaults. Per-page title, description, canonical, robots and
         OG/Twitter title/description are injected by <Seo> (react-helmet). -->
    <!-- The keywords meta tag was removed on 2026-08-26 (A-27): no major search
         engine has used it for over a decade, and a stuffed list reads as spam
         to anyone viewing source. Do not reintroduce it. NB: do not write tag
         syntax inside a comment here: the build re-serializes it into a real
         empty element. -->
    <meta name="author" content="Sponge Hydration" />

    <!-- Open Graph (site-wide defaults; per-page title/description/url via Seo).
         The image file name is versioned on purpose: Facebook, iMessage, LinkedIn
         and X cache a preview by its URL, so a new picture needs a new name.
         Source: marketing/pages/2026-10-08_link-preview-options/ (option A). -->
    <meta property="og:site_name" content="Sponge Hydration" />
    <meta property="og:image" content="https://www.spongehydration.com/og-sponge-tracker-2026-10.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A black and a white Sponge tracker, each clipped under a water bottle, beside the words “The hydration tracker that locks your apps. Clips onto the bottle you already own.”" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.spongehydration.com/og-sponge-tracker-2026-10.jpg" />

    <!-- Fonts: self-hosted Inter variable. See CLAUDE.md. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: Organization only.
         Product, FAQPage, BlogPosting and BreadcrumbList are injected per page
         via <Seo jsonLd={...}>. They used to live here, which meant every page
         (/about, /blog, /team, the legal pages) carried Product and FAQ
         markup for content it did not show. Google requires FAQ markup to match
         FAQ content visible on that page, so that was a guidelines violation
         and the likeliest cause of a manual action. Do not put page-specific
         schema back in this template. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sponge Hydration",
        "url": "https://www.spongehydration.com/",
        "logo": "https://www.spongehydration.com/icon-512.png",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
