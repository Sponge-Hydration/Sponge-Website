<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b6bcb" />

    <!-- Site-wide defaults. Per-page title, description, canonical, robots and
         OG/Twitter title/description are injected by <Seo> (react-helmet). -->
    <!-- The keywords meta tag was removed on 2026-08-26 (A-27): no major search
         engine has used it for over a decade, and a stuffed list reads as spam
         to anyone viewing source. Do not reintroduce it. NB: do not write tag
         syntax inside a comment here — the build re-serializes it into a real
         empty element. -->
    <meta name="author" content="Sponge Hydration" />

    <!-- Open Graph (site-wide defaults; per-page title/description/url via Seo) -->
    <meta property="og:site_name" content="Sponge Hydration" />
    <meta property="og:image" content="https://www.spongehydration.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Sponge-branded water bottle on a kitchen counter, captioned “Tracks every sip. Locks your apps.”" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.spongehydration.com/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data: Organization only.
         Product, FAQPage, BlogPosting and BreadcrumbList are injected per page
         via <Seo jsonLd={...}>. They used to live here, which meant every page
         — /about, /blog, /team, the legal pages — carried Product and FAQ
         markup for content it did not show. Google requires FAQ markup to match
         FAQ content visible on that page, so that was a guidelines violation
         and the likeliest cause of a manual action. Do not put page-specific
         schema back in this template. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sponge Hydration",
        "url": "https://www.spongehydration.com/",
        "logo": "https://www.spongehydration.com/icon-512.png",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
